<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skratch-pad</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090909;
    font-family: Arial, sans-serif;
    color: white;
}

#workspace {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

#imageLayer,
#drawCanvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}

#imageLayer {
    z-index: 10;
    pointer-events: auto;
}

#drawCanvas {
    z-index: 1;
    touch-action: none;
    pointer-events: none;
    cursor: crosshair;
}


/* IMAGE */

.image-container {
    position: absolute;
    transform-origin: center center;
    user-select: none;
    touch-action: none;
}

.image-object {
    display: block;
    user-select: none;
    pointer-events: auto;
    max-width: none;
    border: 1px solid transparent;
    touch-action: none;
    cursor: grab;
}

.image-container.selected .image-object {
    border: 1px dashed rgba(255,255,255,.65);

    box-shadow:
        0 0 0 1px rgba(0,0,0,.5),
        0 0 18px rgba(255,255,255,.08);
}

.image-object:active {
    cursor: grabbing;
}


/* RESIZE HANDLE */

.resize-handle {
    position: absolute;

    right: -7px;
    bottom: -7px;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: white;

    border: 2px solid #111;

    cursor: nwse-resize;

    display: none;

    z-index: 20;
}

.image-container.selected .resize-handle {
    display: block;
}


/* TITLE */

.title {
    position: fixed;
    top: 22px;
    left: 28px;

    font-size: 22px;
    font-weight: 600;
    letter-spacing: .5px;

    z-index: 30;
    pointer-events: none;
}


/* SIDEBAR */

.toolbar {
    position: fixed;

    left: 18px;
    top: 50%;

    transform: translateY(-50%);

    width: 58px;
    padding: 8px;

    display: flex;
    flex-direction: column;
    gap: 8px;

    background: rgba(30,30,30,.65);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 18px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);

    z-index: 30;
}

.tool-btn {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 12px;

    background: transparent;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.tool-btn:hover {
    background: rgba(255,255,255,.1);
}

.tool-btn:active {
    transform: scale(.92);
}

.tool-btn svg {
    width: 21px;
    height: 21px;

    stroke: white;
    fill: none;

    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}


/* SETTINGS */

.settings-panel {
    position: fixed;

    left: 86px;
    top: 50%;

    transform:
        translateY(-50%)
        translateX(-10px);

    width: 230px;
    padding: 16px;

    background: rgba(25,25,25,.78);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 16px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.4);

    opacity: 0;
    pointer-events: none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index: 29;
}

.settings-panel.open {
    opacity: 1;
    pointer-events: auto;

    transform:
        translateY(-50%)
        translateX(0);
}

.settings-title {
    font-size: 14px;
    font-weight: 600;

    margin-bottom: 14px;
}

.setting-label {
    font-size: 12px;
    opacity: .7;

    margin-bottom: 7px;
}

.setting-group {
    margin-bottom: 14px;
}

input[type="range"] {
    width: 100%;
}

.setting-button,
.click-me-btn {
    width: 100%;

    padding: 10px;

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 10px;

    background: rgba(255,255,255,.06);

    color: white;

    cursor: pointer;

    margin-top: 7px;
}

.setting-button:hover,
.click-me-btn:hover {
    background: rgba(255,255,255,.11);
}

.mode-text {
    text-align: center;

    font-size: 11px;

    opacity: .55;

    margin-top: 8px;
}

#imageInput {
    display: none;
}

</style>
</head>

<script>

/* ELEMENTS */

const workspace =
    document.getElementById("workspace");

const imageLayer =
    document.getElementById("imageLayer");

const drawCanvas =
    document.getElementById("drawCanvas");

const ctx =
    drawCanvas.getContext("2d");

const addImageBtn =
    document.getElementById("addImageBtn");

const imageInput =
    document.getElementById("imageInput");

const modeBtn =
    document.getElementById("modeBtn");

const moveIcon =
    document.getElementById("moveIcon");

const pencilIcon =
    document.getElementById("pencilIcon");

const modeLabel =
    document.getElementById("modeLabel");

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsPanel =
    document.getElementById("settingsPanel");

const brushSize =
    document.getElementById("brushSize");

const sizeValue =
    document.getElementById("sizeValue");

const removeImageBtn =
    document.getElementById("removeImageBtn");

const clearDrawingsBtn =
    document.getElementById("clearDrawingsBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const clickMeBtn =
    document.getElementById("clickMeBtn");


/* VARIABLES */

let mode = "move";

let brush = 5;

let selectedImage = null;

let imageCounter = 0;


/* MOVING */

let movingImage = false;

let moveStartX = 0;
let moveStartY = 0;

let originalImageX = 0;
let originalImageY = 0;


/* RESIZING */

let resizingImage = false;

let resizeStartX = 0;

let resizeStartWidth = 0;
let resizeStartHeight = 0;


/* DRAWING */

let drawing = false;


/* CANVAS */

function resizeCanvas() {

    const oldCanvas =
        document.createElement("canvas");

    oldCanvas.width =
        drawCanvas.width;

    oldCanvas.height =
        drawCanvas.height;

    if (
        oldCanvas.width &&
        oldCanvas.height
    ) {

        oldCanvas
            .getContext("2d")
            .drawImage(
                drawCanvas,
                0,
                0
            );
    }


    drawCanvas.width =
        window.innerWidth;

    drawCanvas.height =
        window.innerHeight;


    if (
        oldCanvas.width &&
        oldCanvas.height
    ) {

        ctx.drawImage(
            oldCanvas,
            0,
            0
        );
    }
}

resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* MODE */

function setMode(newMode) {

    mode = newMode;

    movingImage = false;
    resizingImage = false;
    drawing = false;


    if (mode === "draw") {

        drawCanvas.style.zIndex =
            "10";

        imageLayer.style.zIndex =
            "2";

        drawCanvas.style.pointerEvents =
            "auto";

        moveIcon.style.display =
            "none";

        pencilIcon.style.display =
            "block";

        modeLabel.textContent =
            "Draw mode";

    } else {

        drawCanvas.style.zIndex =
            "1";

        imageLayer.style.zIndex =
            "10";

        drawCanvas.style.pointerEvents =
            "none";

        moveIcon.style.display =
            "block";

        pencilIcon.style.display =
            "none";

        modeLabel.textContent =
            "Move mode";
    }
}


setMode("move");


modeBtn.addEventListener(
    "click",
    () => {

        if (mode === "move") {

            setMode("draw");

        } else {

            setMode("move");

        }

    }
);


/* SETTINGS */

settingsBtn.addEventListener(
    "click",
    () => {

        settingsPanel.classList.toggle(
            "open"
        );

    }
);


/* BRUSH */

brushSize.addEventListener(
    "input",
    () => {

        brush =
            Number(
                brushSize.value
            );

        sizeValue.textContent =
            brush;
    }
);


/* ADD IMAGE */

addImageBtn.addEventListener(
    "click",
    () => {

        imageInput.click();

    }
);


imageInput.addEventListener(
    "change",
    (e) => {

        const file =
            e.target.files[0];

        if (!file) return;


        const reader =
            new FileReader();


        reader.onload =
            (event) => {

                createImage(
                    event.target.result
                );

            };


        reader.readAsDataURL(file);

        imageInput.value =
            "";
    }
);


/* CREATE IMAGE */

function createImage(src) {

    const container =
        document.createElement("div");

    container.className =
        "image-container";


    const img =
        document.createElement("img");

    img.className =
        "image-object";

    img.src =
        src;

    img.draggable =
        false;


    const handle =
        document.createElement("div");

    handle.className =
        "resize-handle";


    container.appendChild(img);
    container.appendChild(handle);

    imageLayer.appendChild(
        container
    );


    container.dataset.x = "0";
    container.dataset.y = "0";


    img.onload =
        () => {

            let width =
                img.naturalWidth;

            let height =
                img.naturalHeight;


            const maxWidth =
                window.innerWidth * .7;

            const maxHeight =
                window.innerHeight * .7;


            let scale = 1;


            if (width > maxWidth) {

                scale =
                    maxWidth / width;
            }


            if (
                height * scale >
                maxHeight
            ) {

                scale =
                    maxHeight / height;
            }


            width *= scale;
            height *= scale;


            img.style.width =
                width + "px";

            img.style.height =
                height + "px";


            container.dataset.x =
                (
                    window.innerWidth -
                    width
                ) / 2;


            container.dataset.y =
                (
                    window.innerHeight -
                    height
                ) / 2;


            updateImage(
                container
            );


            selectImage(
                container
            );
        };


    container.addEventListener(
        "pointerdown",
        imagePointerDown
    );


    handle.addEventListener(
        "pointerdown",
        resizePointerDown
    );
}


/* UPDATE IMAGE */

function updateImage(container) {

    const x =
        Number(
            container.dataset.x
        );

    const y =
        Number(
            container.dataset.y
        );


    container.style.left =
        x + "px";

    container.style.top =
        y + "px";
}


/* SELECT */

function selectImage(container) {

    if (selectedImage) {

        selectedImage.classList.remove(
            "selected"
        );
    }


    selectedImage =
        container;


    if (selectedImage) {

        selectedImage.classList.add(
            "selected"
        );
    }
}


/* MOVE IMAGE */

function imagePointerDown(e) {

    if (mode !== "move") {
        return;
    }


    if (
        e.target.classList.contains(
            "resize-handle"
        )
    ) {
        return;
    }


    e.preventDefault();
    e.stopPropagation();


    const container =
        e.currentTarget;


    selectImage(
        container
    );


    movingImage =
        true;


    moveStartX =
        e.clientX;

    moveStartY =
        e.clientY;


    originalImageX =
        Number(
            container.dataset.x
        );

    originalImageY =
        Number(
            container.dataset.y
        );


    try {

        container.setPointerCapture(
            e.pointerId
        );

    } catch {}
}


/* MOVE */

document.addEventListener(
    "pointermove",
    (e) => {

        if (!movingImage) {
            return;
        }

        if (!selectedImage) {
            return;
        }

        if (mode !== "move") {
            return;
        }


        const dx =
            e.clientX -
            moveStartX;

        const dy =
            e.clientY -
            moveStartY;


        selectedImage.dataset.x =
            originalImageX + dx;

        selectedImage.dataset.y =
            originalImageY + dy;


        updateImage(
            selectedImage
        );
    }
);


/* STOP MOVE */

document.addEventListener(
    "pointerup",
    () => {

        movingImage =
            false;

        resizingImage =
            false;
    }
);

document.addEventListener(
    "pointercancel",
    () => {

        movingImage =
            false;

        resizingImage =
            false;
    }
);


/* ---------------- RESIZE ---------------- */

function resizePointerDown(e) {

    if (mode !== "move") {
        return;
    }


    e.preventDefault();
    e.stopPropagation();


    const container =
        e.currentTarget.parentElement;


    selectImage(
        container
    );


    resizingImage =
        true;


    resizeStartX =
        e.clientX;


    resizeStartWidth =
        container.querySelector(
            ".image-object"
        ).offsetWidth;


    resizeStartHeight =
        container.querySelector(
            ".image-object"
        ).offsetHeight;


    try {

        e.currentTarget.setPointerCapture(
            e.pointerId
        );

    } catch {}
}


/* RESIZE MOVE */

document.addEventListener(
    "pointermove",
    (e) => {

        if (!resizingImage) {
            return;
        }

        if (!selectedImage) {
            return;
        }

        if (mode !== "move") {
            return;
        }


        const img =
            selectedImage.querySelector(
                ".image-object"
            );


        const dx =
            e.clientX -
            resizeStartX;


        /*
            Use the horizontal movement
            to resize while keeping the
            original aspect ratio.
        */

        let newWidth =
            resizeStartWidth + dx;


        const aspectRatio =
            resizeStartHeight /
            resizeStartWidth;


        let newHeight =
            newWidth *
            aspectRatio;


        /*
            Minimum size
        */

        const minSize =
            40;


        if (newWidth < minSize) {

            newWidth =
                minSize;

            newHeight =
                newWidth *
                aspectRatio;
        }


        img.style.width =
            newWidth + "px";

        img.style.height =
            newHeight + "px";
    }
);


/* WHEEL RESIZE */

workspace.addEventListener(
    "wheel",
    (e) => {

        if (mode !== "move") {
            return;
        }

        if (!selectedImage) {
            return;
        }


        /*
            Don't resize when
            hovering over the sidebar.
        */

        if (
            e.target.closest(
                ".toolbar"
            ) ||
            e.target.closest(
                ".settings-panel"
            )
        ) {
            return;
        }


        e.preventDefault();


        const img =
            selectedImage.querySelector(
                ".image-object"
            );


        let width =
            img.offsetWidth;


        let height =
            img.offsetHeight;


        const ratio =
            height / width;


        if (e.deltaY < 0) {

            width += 20;

        } else {

            width -= 20;
        }


        width =
            Math.max(
                40,
                width
            );


        height =
            width * ratio;


        img.style.width =
            width + "px";

        img.style.height =
            height + "px";

    },
    {
        passive: false
    }
);


/* ---------------- DRAWING ---------------- */

drawCanvas.addEventListener(
    "pointerdown",
    (e) => {

        if (mode !== "draw") {
            return;
        }


        e.preventDefault();


        drawing =
            true;


        try {

            drawCanvas.setPointerCapture(
                e.pointerId
            );

        } catch {}


        ctx.beginPath();


        ctx.moveTo(
            e.clientX,
            e.clientY
        );


        ctx.lineWidth =
            brush;

        ctx.lineCap =
            "round";

        ctx.lineJoin =
            "round";

        ctx.strokeStyle =
            "#ffffff";
    }
);


drawCanvas.addEventListener(
    "pointermove",
    (e) => {

        if (!drawing) {
            return;
        }

        if (mode !== "draw") {
            return;
        }


        e.preventDefault();


        ctx.lineTo(
            e.clientX,
            e.clientY
        );


        ctx.stroke();
    }
);


function stopDrawing() {

    if (!drawing) {
        return;
    }


    drawing =
        false;


    ctx.closePath();
}


drawCanvas.addEventListener(
    "pointerup",
    stopDrawing
);

drawCanvas.addEventListener(
    "pointercancel",
    stopDrawing
);

drawCanvas.addEventListener(
    "lostpointercapture",
    stopDrawing
);


/* REMOVE IMAGE */

removeImageBtn.addEventListener(
    "click",
    () => {

        if (!selectedImage) {
            return;
        }


        selectedImage.remove();

        selectedImage =
            null;
    }
);


/* CLEAR DRAWINGS */

clearDrawingsBtn.addEventListener(
    "click",
    () => {

        ctx.clearRect(
            0,
            0,
            drawCanvas.width,
            drawCanvas.height
        );
    }
);


/* DOWNLOAD */

downloadBtn.addEventListener(
    "click",
    () => {

        const output =
            document.createElement(
                "canvas"
            );


        output.width =
            window.innerWidth;

        output.height =
            window.innerHeight;


        const outputCtx =
            output.getContext("2d");


        outputCtx.fillStyle =
            "#090909";


        outputCtx.fillRect(
            0,
            0,
            output.width,
            output.height
        );


        const images =
            imageLayer.querySelectorAll(
                ".image-container"
            );


        images.forEach(
            (container) => {

                const img =
                    container.querySelector(
                        ".image-object"
                    );


                const x =
                    Number(
                        container.dataset.x
                    );

                const y =
                    Number(
                        container.dataset.y
                    );


                const width =
                    img.offsetWidth;

                const height =
                    img.offsetHeight;


                outputCtx.drawImage(
                    img,
                    x,
                    y,
                    width,
                    height
                );
            }
        );


        outputCtx.drawImage(
            drawCanvas,
            0,
            0
        );


        const link =
            document.createElement("a");


        link.download =
            "skratch-pad-edit.png";


        link.href =
            output.toDataURL(
                "image/png"
            );


        link.click();
    }
);


/* CLICK ME */

clickMeBtn.addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";
    }
);

</script>

</body>
</html>
