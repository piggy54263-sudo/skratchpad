<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skratch-pad</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090909;
        font-family: Arial, sans-serif;
        color: white;
    }

    #workspace {
        position: fixed;
        inset: 0;
        overflow: hidden;
    }

    #imageLayer,
    #drawCanvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
    }

    /* FIX: images must receive pointer events */
    #imageLayer {
        pointer-events: auto;
        z-index: 2;
    }

    #drawCanvas {
        z-index: 5;
        touch-action: none;
        cursor: crosshair;
    }

    .image-object {
        position: absolute;
        transform-origin: center center;
        user-select: none;
        cursor: grab;
        max-width: none;
        border: 1px solid transparent;
        touch-action: none;
        pointer-events: auto;
    }

    .image-object.selected {
        border: 1px dashed rgba(255,255,255,.65);
        box-shadow:
            0 0 0 1px rgba(0,0,0,.5),
            0 0 18px rgba(255,255,255,.08);
    }

    .image-object:active {
        cursor: grabbing;
    }

    /* TITLE */

    .title {
        position: fixed;
        top: 22px;
        left: 28px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: .5px;
        z-index: 20;
        pointer-events: none;
    }

    /* SIDEBAR */

    .toolbar {
        position: fixed;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 58px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;

        background: rgba(30,30,30,.65);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 18px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow: 0 10px 35px rgba(0,0,0,.35);
        z-index: 20;
    }

    .tool-btn {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background .15s ease, transform .15s ease;
    }

    .tool-btn:hover {
        background: rgba(255,255,255,.1);
    }

    .tool-btn:active {
        transform: scale(.92);
    }

    .tool-btn svg {
        width: 21px;
        height: 21px;
        stroke: white;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    /* SETTINGS PANEL */

    .settings-panel {
        position: fixed;
        left: 86px;
        top: 50%;
        transform: translateY(-50%) translateX(-10px);
        width: 230px;
        padding: 16px;

        background: rgba(25,25,25,.78);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 16px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        box-shadow: 0 15px 40px rgba(0,0,0,.4);

        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;

        z-index: 19;
    }

    .settings-panel.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(-50%) translateX(0);
    }

    .settings-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 14px;
    }

    .setting-label {
        font-size: 12px;
        opacity: .7;
        margin-bottom: 7px;
    }

    .setting-group {
        margin-bottom: 14px;
    }

    input[type="range"] {
        width: 100%;
    }

    .setting-button {
        width: 100%;
        padding: 10px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 10px;
        background: rgba(255,255,255,.06);
        color: white;
        cursor: pointer;
        margin-top: 7px;
    }

    .setting-button:hover {
        background: rgba(255,255,255,.11);
    }

    .click-me-btn {
        width: 100%;
        padding: 10px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 10px;
        background: rgba(255,255,255,.06);
        color: white;
        cursor: pointer;
        margin-top: 7px;
    }

    .click-me-btn:hover {
        background: rgba(255,255,255,.11);
    }

    .mode-text {
        text-align: center;
        font-size: 11px;
        opacity: .55;
        margin-top: 8px;
    }

    #imageInput {
        display: none;
    }
</style>
</head>

<body>

<div id="workspace">

    <div class="title">Skratch-pad</div>

    <div id="imageLayer"></div>

    <canvas id="drawCanvas"></canvas>

    <!-- SIDEBAR -->
    <div class="toolbar">

        <!-- ADD IMAGE -->
        <button class="tool-btn" id="addImageBtn" title="Add image">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
            </svg>
        </button>

        <!-- MODE -->
        <button class="tool-btn" id="modeBtn" title="Switch mode">

            <!-- MOVE ICON -->
            <svg id="moveIcon" viewBox="0 0 24 24">
                <path d="M12 2v20"></path>
                <path d="M2 12h20"></path>
                <path d="M8 6l4-4 4 4"></path>
                <path d="M8 18l4 4 4-4"></path>
                <path d="M6 8l-4 4 4 4"></path>
                <path d="M18 8l4 4-4 4"></path>
            </svg>

            <!-- PENCIL ICON -->
            <svg id="pencilIcon" viewBox="0 0 24 24" style="display:none;">
                <path d="M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20z"></path>
                <path d="M14.5 6.5l3 3"></path>
            </svg>

        </button>

        <!-- SETTINGS -->
        <button class="tool-btn" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20h-2.5v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6v-2.5h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1L9 6.7l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5h2.5v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v2.5h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
            </svg>
        </button>

    </div>

    <!-- SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel">

        <div class="settings-title">Settings</div>

        <div class="setting-group">
            <div class="setting-label">
                Brush size: <span id="sizeValue">5</span>px
            </div>

            <input
                type="range"
                id="brushSize"
                min="1"
                max="50"
                value="5"
            >
        </div>

        <button class="setting-button" id="removeImageBtn">
            Remove selected image
        </button>

        <button class="setting-button" id="clearDrawingsBtn">
            Clear drawings
        </button>

        <button class="setting-button" id="downloadBtn">
            Download PNG
        </button>

        <button class="click-me-btn" id="clickMeBtn">
            Click me!
        </button>

        <div class="mode-text" id="modeLabel">
            Move mode
        </div>

    </div>

</div>

<input
    type="file"
    id="imageInput"
    accept="image/png,image/jpeg,image/webp"
>

<script>

const workspace = document.getElementById("workspace");
const imageLayer = document.getElementById("imageLayer");
const drawCanvas = document.getElementById("drawCanvas");

const addImageBtn = document.getElementById("addImageBtn");
const imageInput = document.getElementById("imageInput");

const modeBtn = document.getElementById("modeBtn");
const moveIcon = document.getElementById("moveIcon");
const pencilIcon = document.getElementById("pencilIcon");
const modeLabel = document.getElementById("modeLabel");

const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");

const brushSize = document.getElementById("brushSize");
const sizeValue = document.getElementById("sizeValue");

const removeImageBtn = document.getElementById("removeImageBtn");
const clearDrawingsBtn = document.getElementById("clearDrawingsBtn");
const downloadBtn = document.getElementById("downloadBtn");
const clickMeBtn = document.getElementById("clickMeBtn");

const ctx = drawCanvas.getContext("2d");

let mode = "move";

let brush = 5;

let selectedImage = null;
let imageCounter = 0;

let movingImage = false;
let moveStartX = 0;
let moveStartY = 0;
let originalImageX = 0;
let originalImageY = 0;

let drawing = false;


/* ---------------- CANVAS ---------------- */

function resizeCanvas() {

    const oldCanvas = document.createElement("canvas");

    oldCanvas.width = drawCanvas.width;
    oldCanvas.height = drawCanvas.height;

    if (oldCanvas.width && oldCanvas.height) {
        oldCanvas.getContext("2d").drawImage(drawCanvas, 0, 0);
    }

    drawCanvas.width = window.innerWidth;
    drawCanvas.height = window.innerHeight;

    if (oldCanvas.width && oldCanvas.height) {
        ctx.drawImage(oldCanvas, 0, 0);
    }
}

resizeCanvas();

/*
    IMPORTANT:
    Start in move mode so the images receive pointer events.
*/
drawCanvas.style.pointerEvents = "none";


window.addEventListener("resize", () => {
    resizeCanvas();
});


/* ---------------- SETTINGS ---------------- */

settingsBtn.addEventListener("click", () => {
    settingsPanel.classList.toggle("open");
});


/* ---------------- BRUSH ---------------- */

brushSize.addEventListener("input", () => {

    brush = Number(brushSize.value);

    sizeValue.textContent = brush;
});


/* ---------------- MODE ---------------- */

modeBtn.addEventListener("click", () => {

    if (mode === "move") {

        mode = "draw";

        moveIcon.style.display = "none";
        pencilIcon.style.display = "block";

        modeLabel.textContent = "Draw mode";

        /*
            Draw canvas receives pointer events.
        */
        drawCanvas.style.pointerEvents = "auto";

    } else {

        mode = "move";

        moveIcon.style.display = "block";
        pencilIcon.style.display = "none";

        modeLabel.textContent = "Move mode";

        /*
            Disable the drawing canvas so images underneath
            can receive pointer events.
        */
        drawCanvas.style.pointerEvents = "none";
    }

});


/* ---------------- ADD IMAGE ---------------- */

addImageBtn.addEventListener("click", () => {
    imageInput.click();
});


imageInput.addEventListener("change", (e) => {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = (event) => {

        createImage(event.target.result);

    };

    reader.readAsDataURL(file);

    imageInput.value = "";
});


/* ---------------- CREATE IMAGE ---------------- */

function createImage(src) {

    const img = document.createElement("img");

    img.className = "image-object";

    img.src = src;

    img.draggable = false;

    img.dataset.id = ++imageCounter;

    imageLayer.appendChild(img);


    img.onload = () => {

        let width = img.naturalWidth;
        let height = img.naturalHeight;

        const maxWidth = window.innerWidth * .7;
        const maxHeight = window.innerHeight * .7;

        let scale = 1;

        if (width > maxWidth) {
            scale = maxWidth / width;
        }

        if (height * scale > maxHeight) {
            scale = maxHeight / height;
        }

        width *= scale;
        height *= scale;

        img.style.width = width + "px";
        img.style.height = height + "px";

        img.dataset.x =
            (window.innerWidth - width) / 2;

        img.dataset.y =
            (window.innerHeight - height) / 2;

        img.dataset.scale = 1;

        updateImage(img);

        selectImage(img);
    };


    /*
        IMPORTANT:
        The image itself listens for pointerdown.
    */
    img.addEventListener("pointerdown", imagePointerDown);

}


/* ---------------- UPDATE IMAGE ---------------- */

function updateImage(img) {

    const x = Number(img.dataset.x);
    const y = Number(img.dataset.y);

    const scale = Number(img.dataset.scale);

    img.style.left = x + "px";
    img.style.top = y + "px";

    img.style.transform = `scale(${scale})`;
}


/* ---------------- SELECT IMAGE ---------------- */

function selectImage(img) {

    if (selectedImage) {
        selectedImage.classList.remove("selected");
    }

    selectedImage = img;

    if (selectedImage) {
        selectedImage.classList.add("selected");
    }
}


/* ---------------- IMAGE MOVEMENT ---------------- */

function imagePointerDown(e) {

    if (mode !== "move") return;

    /*
        Prevent the event from reaching anything else.
    */
    e.stopPropagation();

    const img = e.currentTarget;

    selectImage(img);

    movingImage = true;

    moveStartX = e.clientX;
    moveStartY = e.clientY;

    originalImageX = Number(img.dataset.x);
    originalImageY = Number(img.dataset.y);

    /*
        Capture the pointer so dragging continues
        even if the pointer leaves the image.
    */
    try {
        img.setPointerCapture(e.pointerId);
    } catch {}
}


/* ---------------- MOVE IMAGE ---------------- */

document.addEventListener("pointermove", (e) => {

    if (!movingImage) return;

    if (!selectedImage) return;

    if (mode !== "move") return;

    const dx = e.clientX - moveStartX;
    const dy = e.clientY - moveStartY;

    selectedImage.dataset.x =
        originalImageX + dx;

    selectedImage.dataset.y =
        originalImageY + dy;

    updateImage(selectedImage);

});


/* ---------------- STOP MOVING ---------------- */

document.addEventListener("pointerup", () => {

    movingImage = false;

});


document.addEventListener("pointercancel", () => {

    movingImage = false;

});


/* ---------------- IMAGE RESIZE ---------------- */

workspace.addEventListener("wheel", (e) => {

    if (mode !== "move") return;

    if (!selectedImage) return;

    e.preventDefault();

    let scale =
        Number(selectedImage.dataset.scale);

    if (e.deltaY < 0) {
        scale += .05;
    } else {
        scale -= .05;
    }

    scale = Math.max(.1, Math.min(5, scale));

    selectedImage.dataset.scale = scale;

    updateImage(selectedImage);

}, { passive: false });


/* ---------------- DRAWING ---------------- */

drawCanvas.addEventListener("pointerdown", (e) => {

    if (mode !== "draw") return;

    drawing = true;

    ctx.beginPath();

    ctx.moveTo(e.clientX, e.clientY);

    ctx.lineWidth = brush;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

});


drawCanvas.addEventListener("pointermove", (e) => {

    if (!drawing) return;

    if (mode !== "draw") return;

    ctx.lineTo(e.clientX, e.clientY);

    ctx.strokeStyle = "#ffffff";

    ctx.stroke();

});


drawCanvas.addEventListener("pointerup", () => {

    drawing = false;

    ctx.closePath();

});


drawCanvas.addEventListener("pointercancel", () => {

    drawing = false;

    ctx.closePath();

});


/* ---------------- REMOVE IMAGE ---------------- */

removeImageBtn.addEventListener("click", () => {

    if (!selectedImage) return;

    selectedImage.remove();

    selectedImage = null;

});


/* ---------------- CLEAR DRAWINGS ---------------- */

clearDrawingsBtn.addEventListener("click", () => {

    ctx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

});


/* ---------------- DOWNLOAD ---------------- */

downloadBtn.addEventListener("click", () => {

    const output = document.createElement("canvas");

    output.width = window.innerWidth;
    output.height = window.innerHeight;

    const outputCtx = output.getContext("2d");

    /*
        Dark background.
    */
    outputCtx.fillStyle = "#090909";

    outputCtx.fillRect(
        0,
        0,
        output.width,
        output.height
    );


    /*
        Draw all images.
    */
    const images =
        imageLayer.querySelectorAll(".image-object");

    images.forEach(img => {

        const x = Number(img.dataset.x);
        const y = Number(img.dataset.y);
        const scale = Number(img.dataset.scale);

        const width = img.offsetWidth;
        const height = img.offsetHeight;

        outputCtx.save();

        outputCtx.translate(
            x + width / 2,
            y + height / 2
        );

        outputCtx.scale(scale, scale);

        outputCtx.drawImage(
            img,
            -width / 2,
            -height / 2,
            width,
            height
        );

        outputCtx.restore();

    });


    /*
        Draw the drawings on top.
    */
    outputCtx.drawImage(
        drawCanvas,
        0,
        0
    );


    const link =
        document.createElement("a");

    link.download =
        "skratch-pad-edit.png";

    link.href =
        output.toDataURL("image/png");

    link.click();

});


/* ---------------- CLICK ME ---------------- */

clickMeBtn.addEventListener("click", () => {

    window.location.href = "index.html";

});

</script>

</body>
</html>
