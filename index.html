<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Scratchpad</title>
  <!-- Google Material Outlined Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    /* Reset and Layout */
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* Canvas setup with touch-action none to prevent scroll interference */
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    /* Minimalistic Floating Toolbar */
    .toolbar {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 15px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Button Styling */
    .icon-button {
      background: none;
      border: 1px solid transparent;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      transition: all 0.2s ease;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-button:hover, .icon-button.active {
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    /* Palette Icon & Hidden Color Wheel Wrapper */
    #colorBtn span {
      position: absolute;
      pointer-events: none;
    }

    #colorPicker {
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Drawing Canvas -->
  <canvas id="scratchpad"></canvas>

  <!-- Minimalist Toolbar -->
  <div class="toolbar">
    <button id="colorBtn" class="icon-button active" title="Choose Color">
      <span class="material-symbols-outlined">palette</span>
      <input type="color" id="colorPicker" value="#ffffff">
    </button>
    <button id="eraserBtn" class="icon-button" title="Eraser">
      <span class="material-symbols-outlined">ink_eraser</span>
    </button>
    <button id="settingsBtn" class="icon-button" title="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('scratchpad');
    const ctx = canvas.getContext('2d');
    const colorBtn = document.getElementById('colorBtn');
    const colorPicker = document.getElementById('colorPicker');
    const eraserBtn = document.getElementById('eraserBtn');
    const settingsBtn = document.getElementById('settingsBtn');

    // Handle high-res full screen scaling
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); 

    let isDrawing = false;
    let currentTool = 'brush'; 
    let currentColor = colorPicker.value;

    // Tool Switching Logic
    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.icon-button').forEach(btn => btn.classList.remove('active'));
      if (tool === 'brush') colorBtn.classList.add('active');
      else if (tool === 'eraser') eraserBtn.classList.add('active');
    }

    colorBtn.addEventListener('click', () => setActiveTool('brush'));
    colorPicker.addEventListener('input', (e) => {
      currentColor = e.target.value;
      setActiveTool('brush');
    });
    eraserBtn.addEventListener('click', () => setActiveTool('eraser'));
    settingsBtn.addEventListener('click', () => alert("Settings menu: Ready for customization!"));

    // Coordinate mapping for mouse & touch
    function getCoordinates(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    // Drawing Functions
    function startDrawing(e) {
      isDrawing = true;
      const coords = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      
      if (currentTool === 'eraser') {
        ctx.strokeStyle = '#000000'; // Blends into the black background
        ctx.lineWidth = 24;          // Wider stroke for easy erasing
      } else {
        ctx.strokeStyle = currentColor; 
        ctx.lineWidth = 4;           // Clean standard brush size
      }

      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function draw(e) {
      if (!isDrawing) return;
      const coords = getCoordinates(e);
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.closePath();
    }

    // Mouse Event Listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch Event Listeners (for phones/tablets)
    canvas.addEventListener('touchstart', (e) => startDrawing(e));
    canvas.addEventListener('touchmove', (e) => draw(e));
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchcancel', stopDrawing);
  </script>
</body>
</html>
