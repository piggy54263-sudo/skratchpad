<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Draw | GitHub</title>
  <!-- 100% Free Google Material Outlined Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="scratchpad"></canvas>

  <div class="toolbar">
    <button id="colorBtn" class="icon-button active" title="Choose Color">
      <span class="material-symbols-outlined">palette</span>
      <input type="color" id="colorPicker" value="#ffffff">
    </button>
    
    <button id="eraserBtn" class="icon-button" title="Eraser">
      <span class="material-symbols-outlined">ink_eraser</span>
    </button>
    
    <button id="settingsBtn" class="icon-button" title="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
