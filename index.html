<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Scratchpad</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <style>
    /* Reset and layout */
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    /* CRITICAL FIX: touch-action: none stops browser drag/scroll interference */
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none; 
    }

    /* Minimalistic Floating Toolbar */
    .toolbar {
      position: fixed;
      top: 25px;
      right: 25px;
      display: flex;
      gap: 15px;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10; /* Ensures toolbar stays clickable above canvas */
    }

    .icon-button {
      background: none;
      border: 1px solid transparent;
      font-size: 26px;
      cursor: pointer;
      padding: 10px;
      border-radius: 10px;
      transition: all 0.2s ease;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-button:hover, .icon-button.active {
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
    }

    #colorBtn span {
      position: absolute;
      pointer-events: none;
    }

    #colorPicker {
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <canvas id="scratchpad"></canvas>

  <div class="toolbar">
    <button id="colorBtn" class="icon-button active" title="Choose Color">
      <span class="material-symbols-outlined">palette</span>
      <input type="color" id="colorPicker" value="#ffffff">
    </button>
    <button id="eraserBtn" class="icon-button" title="Eraser">
      <span class="material-symbols-outlined">ink_eraser</span>
    </button>
    <button id="settingsBtn" class="icon-button" title="Settings">
      <span class="material-symbols-outlined">settings</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('scratchpad');
    const ctx = canvas.getContext('2d');
    const colorBtn = document.getElementById('colorBtn');
    const colorPicker = document.getElementById('colorPicker');
    const eraserBtn = document.getElementById('eraserBtn');
    const settingsBtn = document.getElementById('settingsBtn');

    // Set high-res canvas dimensions
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas(); 

    let isDrawing = false;
    let currentTool = 'brush'; 
    let currentColor = colorPicker.value;

    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.icon-button').forEach(btn => btn.classList.remove('active'));
      if (tool === 'brush') colorBtn.classList.add('active');
      else if (tool === 'eraser') eraserBtn.classList.add('active');
    }

    colorBtn.addEventListener('click', () => setActiveTool('brush'));
    colorPicker.addEventListener('input', (e) => {
      currentColor = e.target.value;
      if (currentTool === 'brush') setActiveTool('brush');
    });
    eraserBtn.addEventListener('click', () => setActiveTool('eraser'));
    settingsBtn.addEventListener('click', () => alert("Settings menu coming up next!"));

    function getCoordinates(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startDrawing(e) {
      isDrawing = true;
      const coords = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      
      if (currentTool === 'eraser') {
        ctx.strokeStyle = '#000000'; // Matches background
        ctx.lineWidth = 20; 
      } else {
        ctx.strokeStyle = currentColor; 
        ctx.lineWidth = 4; 
      }

      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function draw(e) {
      if (!isDrawing) return;
      const coords = getCoordinates(e);
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
      ctx.closePath();
    }

    // Mouse Events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch Events
    canvas.addEventListener('touchstart', (e) => {
      startDrawing(e);
    });
    canvas.addEventListener('touchmove', (e) => {
      draw(e);
    });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchcancel', stopDrawing);
  </script>
</body>
</html>
