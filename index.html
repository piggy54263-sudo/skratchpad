<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Draw | GitHub</title>
  <!-- Link to FontAwesome for the cool outlined icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The black drawing board -->
  <canvas id="scratchpad"></canvas>

  <!-- The floating minimalistic menu -->
  <div class="toolbar">
    <!-- NEW: Palette Icon with Hidden Color Picker -->
    <button id="colorBtn" class="icon-button" title="Choose Color">
      <i class="far fa-palette"></i> <!-- Far = FontAwesome Regular (outlined) -->
      <input type="color" id="colorPicker" value="#ffffff">
    </button>
    
    <!-- NEW: The Eraser Icon Button -->
    <button id="eraserBtn" class="icon-button" title="Eraser">
      <i class="far fa-eraser"></i>
    </button>
    
    <!-- Updated Settings Icon (now outlined) -->
    <button id="settingsBtn" class="icon-button" title="Settings">
      <i class="far fa-gear"></i>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
